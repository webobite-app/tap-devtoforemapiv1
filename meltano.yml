version: 1
send_anonymous_usage_stats: true
project_id: tap-devtoforemapiv1
default_environment: test
venv:
  backend: uv
environments:
- name: test
plugins:
  extractors:
  - name: tap-devtoforemapiv1
    namespace: tap_devtoforemapiv1
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      render_config: true
      # filename: configs/devto/devto.yml
      username: "{{ env.TAP_DEVTOFOREMAPIV1_USERNAME }}"
      api-key: "{{ env.TAP_DEVTOFOREMAPIV1_API_KEY }}"
      start_date: "{{ env.TAP_DEVTOFOREMAPIV1_START_DATE }}"
      base_url: "https://dev.to/api"
      blog_slug: "{{ env.TAP_DEVTOFOREMAPIV1_BLOG_SLUG }}"
      include_comments: "{{ env.TAP_DEVTOFOREMAPIV1_INCLUDE_COMMENTS }}"
      include_tags: "{{ env.TAP_DEVTOFOREMAPIV1_INCLUDE_TAGS }}"
      streams: configs/devto/streams.yml
  - name: tap-wordpress
    namespace: tap_wordpress
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      filename: configs/wordpress/wordpress.yml

  - name: tap-hashnode
    namespace: tap_hashnode
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    config:
      filename: configs/hashnode/hashnode.yml

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
